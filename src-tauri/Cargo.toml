[package]
name = "rustclass"
description = "RustClass — an offline-first digital classroom"
authors = ["ElectronIx"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "rustclass_lib"
# RustClass is a Windows desktop application. The `staticlib` and `cdylib`
# crate types in the stock Tauri template exist only to support mobile targets,
# and a cdylib of this size exceeds what mingw's linker can export, so a
# Windows cross-build fails at the link step for no reason that matters here.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustclass-core = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
